<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Stand - Our Class Phone Museum</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <p class="college">Swamy Vivekananda Rural First Grade College &middot; V Semester BCA</p>
  <h1><span class="ico">&#128241;</span> <span class="grad">Phone Stand</span></h1>
  <p class="sub">Our class phone museum</p>
  <div class="prog">
    <div class="bar"><i id="bar"></i></div>
    <p><b id="count">0</b> of <b id="total">0</b> phones added &middot; <span id="pct">0%</span></p>
  </div>
</header>
<section class="tools">
  <input id="q" type="search" placeholder="Search name, phone or app...">
  <select id="av"><option value="">All Android versions</option></select>
  <select id="st"><option value="">All students</option><option value="added">Phone added</option><option value="none">Not added yet</option></select>
</section>
<p class="hint">Hover (or tap) a phone to flip it and see the details.</p>
<main id="stand"></main>
<section id="fun"></section>
<footer>Built by the class with HTML, CSS and JavaScript &middot; every student edits only their own file</footer>
<script src="js/roster.js"></script>
<script src="js/app.js"></script>
</body>
</html>
